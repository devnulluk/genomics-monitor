services:
  genomics-monitor:
    build: .
    restart: unless-stopped
    # TrueNAS creates a new bind-mount directory as root. Run as root at the
    # container boundary so SQLite and streamed imports can initialise it;
    # the API remains token protected and is published only on the private LAN.
    user: "0:0"
    environment:
      GENOMICS_DB: /data/genomics.sqlite
      GENOME_BUILD: ${GENOME_BUILD:-GRCh38}
      GENOMICS_API_TOKEN_FILE: ${GENOMICS_API_TOKEN_FILE:-}
      GENOMICS_API_TOKEN: ${GENOMICS_API_TOKEN:-}
    volumes:
      - ${GENOMICS_DATA_DIR:-/mnt/zpool1/docker/genomics-monitor}:/data
    ports:
      - "${GENOMICS_PORT:-31030}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
